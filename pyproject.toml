[project]
name = "agent-newsletter"
version = "0.0.1"
description = "Daily AI-agents newsletter pipeline"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Coverage options applied whenever pytest is run locally or in CI.
# --cov-fail-under is the regression gate: the build fails if total
# coverage drops below this percentage.  Raise it as tests are added.
# Baseline after PRs #43-#61 (402 tests): 100% line coverage, 99.39% branch.
# Gate set at 95 (5 points of headroom below branch baseline).
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
# Write relative source paths so coverage.xml works in CI (py-cov-action v3
# requires relative paths; absolute paths cause "No source for code" errors).
relative_files = true

[tool.coverage.report]
# Lines only reachable when the module is run as __main__ don't count
# against coverage — they're tested implicitly by the CLI.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
