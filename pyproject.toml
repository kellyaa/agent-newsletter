[project]
name = "agent-newsletter"
version = "0.0.1"
description = "Daily AI-agents newsletter pipeline"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Coverage options applied whenever pytest is run locally or in CI.
# --cov-fail-under is the regression gate: the build fails if total
# coverage drops below this percentage.  Raise it as tests are added.
# Baseline after PRs #43-#51 + #57 (full backfill coverage): 98.50%.
# Gate set at 85 (13 points of headroom to absorb minor fluctuation and
# future code additions before new tests are written).
# The 13-point buffer is intentionally larger than usual: the remaining
# uncovered lines (rank.py 177/302 dead code, fetch.py/llm.py/prefilter.py
# edge branches, replay_writer.py) are all low-risk paths that may be
# excluded via pragma: no cover in a follow-up PR (see issue #47).
addopts = "--cov=scripts --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.report]
# Lines only reachable when the module is run as __main__ don't count
# against coverage — they're tested implicitly by the CLI.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
