# Source-family → section defaults (in scripts/prefilter.py SECTION_BY_FAMILY):
#   rss → blogs, arxiv/hf-daily → papers, gh/hn/reddit → news
#
# Any source entry below may add an optional `section:` field to override the
# family default. Allowed values: papers | news | blogs. Invalid values are
# logged and ignored. The override is stamped onto every item the source
# emits and persists to items.section_override in state.db.
#
# Example: a vendor blog whose RSS is really release announcements →
#   - id: vendor-x
#     url: https://x.com/blog/rss
#     section: news
#
# Optional `keyword_gate_bypass: true` skips the prefilter keyword gate for a
# source. Use sparingly — only for low-volume, hand-curated practitioner blogs
# whose every post is plausibly relevant. The LLM ranker still scores them
# downstream. High-volume noisy sources (HN/Reddit/arxiv) should keep the gate.
#
# Optional `recency_days: N` (positive int) overrides the family default
# recency window in scripts/prefilter.py RECENCY_DAYS. Use for slow-publishing
# sources (e.g., Hamel posts every 4-7 weeks; bump to 90). Invalid values are
# logged and ignored. Don't set this on high-volume sources.

rss:
  - id: simonw
    name: "Simon Willison's Weblog"
    url: https://simonwillison.net/atom/everything/
    keyword_gate_bypass: true

  - id: latent-space
    name: "Latent Space"
    url: https://www.latent.space/feed
    keyword_gate_bypass: true

  - id: interconnects
    name: "Interconnects (Nathan Lambert)"
    url: https://www.interconnects.ai/feed
    keyword_gate_bypass: true

  - id: raschka
    name: "Sebastian Raschka — Ahead of AI"
    url: https://magazine.sebastianraschka.com/feed
    keyword_gate_bypass: true
    recency_days: 90

  - id: eugene-yan
    name: "Eugene Yan"
    url: https://eugeneyan.com/rss/
    keyword_gate_bypass: true

  - id: hamel
    name: "Hamel Husain"
    url: https://hamel.dev/index.xml
    keyword_gate_bypass: true
    recency_days: 90

  - id: karuparti
    name: "Karuparti"
    url: https://newsletter.karuparti.com/feed
    keyword_gate_bypass: true

  - id: cameron-wolfe
    name: "Cameron R. Wolfe — Deep (Learning) Focus"
    url: https://cameronrwolfe.substack.com/feed
    keyword_gate_bypass: true

  - id: ethan-mollick
    name: "Ethan Mollick — One Useful Thing"
    url: https://www.oneusefulthing.org/feed
    # No keyword_gate_bypass: Mollick covers AI broadly; let the keyword gate
    # filter to agent-relevant posts. Senior-engineer audience is the same.

  # Investigated & dropped (2026-05-15). Revisit if upstream restores RSS.
  # Sources requiring HTML scraping are tracked in #10 (fetch_html adapter),
  # not here:
  #   - The AI Exchange / Every (Dan Shipper)  — every.to has no public RSS path
  #   - The Batch (DeepLearning.AI)            — all RSS endpoints return 404/500
  #   - LangChain Blog                         — Webflow site, /blog/rss serves HTML
  #                                              (covered by GitHub releases watchlist)
  #   - Galileo AI Blog                        — no working endpoint
  #   - Anthropic /news, OpenAI /research      — no RSS; deferred to #10
  #   - GMI Cloud Blog                         — no RSS as of 2026-05-15; deferred to #10

arxiv:
  # arXiv Atom-API queries. Each query runs daily and returns most recent matches.
  # Categories: cs.AI, cs.CL, cs.SE, cs.MA (multi-agent), cs.LG
  - id: arxiv-agents
    name: "arXiv: agent-related"
    query: 'cat:cs.AI AND (abs:"agent" OR abs:"tool use" OR abs:"tool-calling" OR abs:"multi-agent")'
    max_results: 50

  - id: arxiv-llm-systems
    name: "arXiv: LLM systems / evals"
    query: 'cat:cs.CL AND (abs:"LLM agent" OR abs:"language agent" OR abs:"agent benchmark" OR abs:"tool-augmented")'
    max_results: 30

  - id: arxiv-software-eng
    name: "arXiv: code/SWE agents"
    query: 'cat:cs.SE AND (abs:"LLM" OR abs:"agent" OR abs:"code generation")'
    max_results: 30

hn:
  # Hacker News via Algolia. The `query` parameter is free-text, NOT boolean;
  # avoid 'OR' / quoted phrases. One concept per query, dedup downstream.
  - id: hn-agent
    name: "HN: agent"
    query: "agent"
    hours_back: 48
    min_points: 40

  - id: hn-llm
    name: "HN: llm"
    query: "llm"
    hours_back: 48
    min_points: 40

  - id: hn-mcp
    name: "HN: MCP"
    query: "mcp"
    hours_back: 48
    min_points: 30

  - id: hn-claude
    name: "HN: claude"
    query: "claude"
    hours_back: 48
    min_points: 40

reddit:
  # Reddit JSON endpoints. Score-gated in prefilter.
  - id: reddit-localllama
    name: "r/LocalLLaMA"
    url: https://www.reddit.com/r/LocalLLaMA/top.json?t=day
    min_score: 100

  - id: reddit-mlops
    name: "r/MachineLearning"
    url: https://www.reddit.com/r/MachineLearning/top.json?t=day
    min_score: 100

# GitHub releases removed as a source (2026-05-14). Release-note dumps were
# crowding the News bucket with low-signal version churn that the LLM ranker
# struggled to score concisely, occasionally pushing the rank step past its
# 15-minute timeout. Re-add via the github_releases: key if needed.
github_releases: []

hf_daily:
  # Hugging Face daily papers — scrape, no official API.
  - id: hf-daily-papers
    url: https://huggingface.co/papers

# Generic HTML index-page scraper (issue #10). Use for vendor pages that
# don't expose RSS. Selectors are CSS; matching is via selectolax.
#
# Required keys:  id, name, url, link_selector
# Optional keys:  title_selector, date_selector, excerpt_selector, max_items,
#                 section (overrides the html→news default), keyword_gate_bypass,
#                 recency_days
#
# The link_selector may match either an <a> element directly or a wrapping
# element that contains an <a> — the collector falls back to the first
# descendant anchor. title_selector, date_selector, excerpt_selector are
# applied *relative to the link element* (element.css_first(sel)).
#
# Failure behavior: if link_selector matches nothing, the collector logs a
# warning and yields no items (mirrors the RSS adapter's per-source error
# isolation). HTML structure changes without warning; expect to update
# selectors periodically.
html:
  # Canonical example — Anthropic /news. Selectors will drift; update as
  # needed. Enabled starting when someone verifies the current structure.
  # - id: anthropic-news
  #   name: "Anthropic News"
  #   url: https://www.anthropic.com/news
  #   link_selector: 'a[href^="/news/"]'
  #   title_selector: 'h3'
  #   date_selector: 'time'
  #   max_items: 20
