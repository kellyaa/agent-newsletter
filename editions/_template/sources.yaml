# Feed list for this edition. Families: rss, arxiv, hn, reddit, html,
# github_releases. See editions/agents/sources.yaml for a fully worked example
# and CONTRIBUTING.md ("Adding or removing a feed source") for the per-source
# overrides (section, keyword_gate_bypass, recency_days).
#
# Source ids must be unique within a family. Section defaults: rss -> blogs,
# arxiv -> papers, hn/reddit/html/gh -> news.
#
# Do not guess feed URLs: check each one with
#   uv run scripts/check_edition.py <slug>
# which fetches every source and prints how many items survive each prefilter
# gate.

rss: []
