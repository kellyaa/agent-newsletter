  - id: stackoverflow-blog
    name: "Stack Overflow Blog"
    url: https://stackoverflow.blog/feed/

  - id: leaddev
    name: "LeadDev"
    url: https://leaddev.com/feed

  # Added for #291 (owner decision: more sources, after featured items fell
  # to 0-2 a day). Hand-picked practitioner writers bypass the gate; broad
