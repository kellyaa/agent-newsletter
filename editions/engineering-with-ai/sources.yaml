arxiv:
  - id: arxiv-se-ai-dev
    name: "arXiv: cs.SE AI-assisted development"
    query: 'cat:cs.SE AND (abs:"LLM-assisted" OR abs:"AI-assisted" OR abs:"developer productivity" OR abs:"AI-generated code")'
    max_results: 30

  - id: arxiv-se-review-test
    name: "arXiv: cs.SE review and test generation"
    query: 'cat:cs.SE AND (abs:"code review" OR abs:"test generation") AND (abs:"LLM" OR abs:"language model")'
    max_results: 30

hn:
  # Probed against Algolia on 2026-10-25 (#330): a 48h window with a 40-50 point
  # floor returned nothing for these narrow terms, so the window is the lever.
  # hours_back widens the fetch; recency_days keeps the prefilter from dropping
  # those older hits (the hn family default is 3 days). Dedupe by items.id and
  # the published-status check stop repeats across days. Keep min_points >= 40.
  # Dropped: copilot, cursor, vibe coding (0 hits at every threshold for a week).
  - id: hn-claude-code
    name: "HN: claude code"
    query: "claude code"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-ai-coding
    name: "HN: ai coding"
    query: "ai coding"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-code-review
    name: "HN: code review"
    query: "code review"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-coding-agent
    name: "HN: coding agent"
    query: "coding agent"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-llm-code
    name: "HN: llm code"
    query: "llm code"
    hours_back: 168
    min_points: 40
    recency_days: 7

reddit:
  # Noisy. The keyword gate stays on and `limit` (top N of the day, from the
  # subreddit's Atom feed; Reddit 403s .json without OAuth) is small.
  - id: reddit-experienceddevs
    name: "r/ExperiencedDevs"
    url: https://www.reddit.com/r/ExperiencedDevs/top.json?t=day
    limit: 5

  - id: reddit-programming
    name: "r/programming"
    url: https://www.reddit.com/r/programming/top.json?t=day
    limit: 5

  - id: reddit-softwareengineering
    name: "r/softwareengineering"
    url: https://www.reddit.com/r/softwareengineering/top.json?t=day
    limit: 5

html: []
github_releases: []
