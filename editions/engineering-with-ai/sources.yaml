# Feed list for Engineering with AI Daily. Starter sources from #291 section 10; every
# URL was fetched by check_edition.py before merge (see REVIEW.md for the
# results and for sources that did not survive). Families: rss, arxiv, hn,
# reddit, html, github_releases. See editions/agents/sources.yaml for the
# fully worked example.
#
# Practitioner blogs publish rarely and are hand-picked, so they bypass the
# keyword gate. Anything high-volume or general (HN, Reddit, broad engineering
# blogs) keeps the gate.

rss:
  - id: fowler
    name: "Martin Fowler"
    url: https://martinfowler.com/feed.atom
    keyword_gate_bypass: true
    recency_days: 30

  - id: pragmatic-engineer
    name: "The Pragmatic Engineer"
    url: https://blog.pragmaticengineer.com/rss/
    keyword_gate_bypass: true
    recency_days: 30

  - id: addy-osmani
    name: "Addy Osmani"
    url: https://addyo.substack.com/feed
    keyword_gate_bypass: true
    recency_days: 30

  - id: tidy-first
    name: "Kent Beck — Tidy First?"
    url: https://tidyfirst.substack.com/feed
    keyword_gate_bypass: true
    recency_days: 60

  - id: charity-majors
    name: "Charity Majors"
    url: https://charity.wtf/feed/
    keyword_gate_bypass: true
    recency_days: 60

  - id: lucumr
    name: "Armin Ronacher"
    url: https://lucumr.pocoo.org/feed.atom
    keyword_gate_bypass: true
    recency_days: 60

  - id: simonw
    name: "Simon Willison's Weblog"
    url: https://simonwillison.net/atom/everything/
    # Shared with the agents edition. High volume and broad, so keep the gate.

  - id: github-blog
    name: "GitHub Blog — Engineering"
    url: https://github.blog/engineering/feed/

  - id: stackoverflow-blog
    name: "Stack Overflow Blog"
    url: https://stackoverflow.blog/feed/

  - id: leaddev
    name: "LeadDev"
    url: https://leaddev.com/feed

arxiv:
  - id: arxiv-se-ai-dev
    name: "arXiv: cs.SE AI-assisted development"
    query: 'cat:cs.SE AND (abs:"LLM-assisted" OR abs:"AI-assisted" OR abs:"developer productivity" OR abs:"AI-generated code")'
    max_results: 30

  - id: arxiv-se-review-test
    name: "arXiv: cs.SE review and test generation"
    query: 'cat:cs.SE AND (abs:"code review" OR abs:"test generation") AND (abs:"LLM" OR abs:"language model")'
    max_results: 30

hn:
  # Probed against Algolia on 2026-10-25 (#330): a 48h window with a 40-50 point
  # floor returned nothing for these narrow terms, so the window is the lever.
  # hours_back widens the fetch; recency_days keeps the prefilter from dropping
  # those older hits (the hn family default is 3 days). Dedupe by items.id and
  # the published-status check stop repeats across days. Keep min_points >= 40.
  # Dropped: copilot, cursor, vibe coding (0 hits at every threshold for a week).
  - id: hn-claude-code
    name: "HN: claude code"
    query: "claude code"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-ai-coding
    name: "HN: ai coding"
    query: "ai coding"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-code-review
    name: "HN: code review"
    query: "code review"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-coding-agent
    name: "HN: coding agent"
    query: "coding agent"
    hours_back: 168
    min_points: 40
    recency_days: 7

  - id: hn-llm-code
    name: "HN: llm code"
    query: "llm code"
    hours_back: 168
    min_points: 40
    recency_days: 7

reddit:
  # Noisy. The keyword gate stays on and the upvote floor is high.
  - id: reddit-experienceddevs
    name: "r/ExperiencedDevs"
    url: https://www.reddit.com/r/ExperiencedDevs/top.json?t=day
    min_score: 150

  - id: reddit-programming
    name: "r/programming"
    url: https://www.reddit.com/r/programming/top.json?t=day
    min_score: 200

  - id: reddit-softwareengineering
    name: "r/softwareengineering"
    url: https://www.reddit.com/r/softwareengineering/top.json?t=day
    min_score: 100

html: []
github_releases: []
