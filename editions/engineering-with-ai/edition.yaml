# Engineering with AI Daily.
#
# AI is the tool, software is the product: how engineering practice, quality,
# security, architecture and team process change when AI writes, reviews and
# operates the code. Boundary with `agents` (where the agent is the product):
# agent internals belong there. Some overlap on "using coding agents as a
# practitioner" is accepted (#291, A3); agents pillar 2 is not narrowed.
#
# Renamed from `breaking-changes` ("Breaking Changes: Engineering Practice in the
# Agent Era") to `engineering-with-ai` in #323 while still a draft: "Breaking"
# read as an alarm, and the new name says what the edition covers and follows
# the pattern of AI Agents Daily. The slug is permanent once live (it is in URLs).
#
slug: engineering-with-ai

name: Engineering with AI Daily

tagline: How AI changes the way software gets built, reviewed, secured and shipped, for engineers and the teams they lead.

status: draft

order: 20

reader_profile: >-
  Senior engineer, tech lead, staff+ engineer or engineering manager who ships
  production software and is deciding how their team should work with AI. They
  care about: AI-assisted development in practice (workflows that work,
  measured productivity, where assistants and coding agents help and where they
  hurt); quality and verification of AI-written code (testing, review,
  regressions, maintainability over time); security and supply chain
  (hallucinated dependencies, leaked secrets, prompt injection through dev
  tools, provenance and licensing); architecture and systems design for systems
  that contain LLM components (reliability, cost, latency, platform and LLMOps);
  team, process and the SDLC (code ownership, onboarding, documentation, DORA
  and similar metrics, hiring and skills); and tooling news that changes how
  people work (IDE and CLI assistant releases, platform changes, deprecations).
  Here AI is the tool and software is the product. Down-weighted: "AI will
  replace developers" takes, consumer AI and funding news, agent-internals deep
  dives, model launches with no impact on developer workflow, prompt-tip
  listicles and vendor marketing.

downweighted:
  - '"AI will replace developers" takes'
  - consumer AI and funding news
  - agent-internals deep dives (those belong in the AI Agents Daily edition)
  - model launches with no impact on developer workflow
  - prompt-tip listicles and vendor marketing

