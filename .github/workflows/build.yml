name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch to avoid duplicate work.
# Do NOT cancel main-branch runs — every merge should get a clean signal.
# Mirrors the concurrency policy in tests.yml, including per-SHA push groups.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Catches site build breaks before they reach deploy.yml, which only runs
  # after merge. Builds against an empty issues tree (content lives on the
  # content branch). The matrix includes deploy.yml's Node version plus the
  # next LTS so an upgrade is pre-validated. pytest stays in tests.yml.
  site-build:
    runs-on: ubuntu-latest
    # Cap runaway jobs (pnpm install stalls, Astro build hangs) to protect
    # the free-tier minutes budget. Typical build is well under a minute.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
