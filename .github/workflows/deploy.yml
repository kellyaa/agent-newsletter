name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, content]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap runaway jobs (pnpm install stalls, Astro build hangs) to protect
    # the free-tier minutes budget. Typical build is ~35–55s; 10 min is
    # generous for a cold pnpm cache. Refs bead 8274fcf3-c6f.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4
        with:
          ref: main

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4
        with:
          ref: content
          path: _content

      - name: Stage content from content branch
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p site/src/content/issues
          cp -r _content/site/src/content/issues/. site/src/content/issues/

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build with Astro
        env:
          # Set both site URL and base path so links resolve under /<repo>/.
          SITE_URL: ${{ steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages@v4 usually completes in ~30–60s; a 5-minute
    # cap catches Pages-infra hangs without risking legitimate deploys.
    # Refs bead 8274fcf3-c6f and flaky-deploy bead 21af9c2d-34a.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # actions/deploy-pages@v4
