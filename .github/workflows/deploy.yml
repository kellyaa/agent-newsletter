name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, content]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap runaway jobs (pnpm install stalls, Astro build hangs) to protect
    # the free-tier minutes budget. Typical build is ~35–55s; 10 min is
    # generous for a cold pnpm cache. Refs bead 8274fcf3-c6f.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: content
          path: _content

      # Multi-edition layout (#301): editions/<slug>/issues/ on content is
      # staged as site/src/content/issues/<slug>/.
      - name: Stage content from content branch
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p site/src/content/issues
          for dir in _content/editions/*/issues; do
            [ -d "$dir" ] || continue
            slug=$(basename "$(dirname "$dir")")
            [ "$slug" = "_template" ] && continue
            mkdir -p "site/src/content/issues/$slug"
            cp -r "$dir/." "site/src/content/issues/$slug/"
          done

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Must run before the build: steps.pages outputs only exist for later steps.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build with Astro
        env:
          # Set both site URL and base path so links resolve under /<repo>/.
          SITE_URL: ${{ steps.pages.outputs.origin || format('https://{0}.github.io', github.repository_owner) }}
          SITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # actions/deploy-pages@v5 usually completes in ~30–60s; a 5-minute
    # cap catches Pages-infra hangs without risking legitimate deploys.
    # Refs bead 8274fcf3-c6f and flaky-deploy bead 21af9c2d-34a.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
