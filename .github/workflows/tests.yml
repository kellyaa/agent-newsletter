name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR/branch to avoid duplicate work.
# Do NOT cancel main-branch runs — every merge should get a clean signal.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token: pytest job only needs to read the checkout;
# py-cov-action needs pull-requests: write to post the coverage comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Cap runaway jobs (uv resolve loops, hung pytest fixtures) to protect
    # the free-tier minutes budget. Typical run is ~90s; 10 min is generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # astral-sh/setup-uv@v5
        with:
          # Enable uv's built-in caching keyed on pyproject.toml + uv.lock.
          # Speeds up cold runs from ~15s to ~3s. Refs bead 2191707c-1b0.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: uv sync --extra test

      # Gate is read from pyproject.toml [tool.pytest.ini_options] addopts.
      # Do NOT hardcode --cov-fail-under here — change it in pyproject.toml
      # so both local runs and CI use the same threshold (refs #52, #55).
      - run: uv run pytest --cov=scripts --cov-report=xml --cov-report=term

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      # Post a coverage summary comment on PRs so contributors can see which
      # lines are uncovered without downloading the artifact manually.
      # Runs on pull_request events only; skipped on direct pushes to main.
      - name: Coverage comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Annotate changed lines that lack coverage directly in the PR diff.
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning
          # Note: relative_files = true is set in [tool.coverage.run] in pyproject.toml
          # (py-cov-action v3 does not accept RELATIVE_FILES as an input param).
